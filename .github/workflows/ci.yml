name: CI

on:
  push:
    branches: [main]
  pull_request:

# A run that takes twenty minutes is a run nobody waits for, so the jobs are
# split and the slow one is the only one that installs Python.
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The cross-language test starts the real Python worker. It needs no
      # models and no ffmpeg, and it is the only check that would notice the two
      # implementations drifting apart.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      # A cross-language contract that exists in only one language is how two
      # runtimes quietly diverge, so a stale schemas/ fails the build.
      - run: pnpm schema:check
      # A broken link in the README is read by somebody deciding whether to use
      # this at all.
      - run: pnpm docs:check

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # numpy and Pillow are what the CLIP preprocessing goldens need to run at
      # all. Without them those tests skip, and a golden that skips in CI is
      # decoration: the whole point of `clip_golden.json` is that a change to the
      # tokeniser or the resize fails here rather than quietly returning slightly
      # worse vectors forever.
      - run: pip install pytest ruff numpy pillow regex ftfy
      # CLIP's merge table: 1.3 MB, MIT, from OpenAI's own repository. Fetched
      # rather than committed — it is a model asset, not source — and pinned by
      # digest, because a different merge table silently produces different
      # tokens for everything and the golden failures would look like a bug in
      # the test.
      - name: Fetch CLIP's merge table
        run: |
          curl -sSfL -o /tmp/bpe_simple_vocab_16e6.txt.gz \
            https://raw.githubusercontent.com/openai/CLIP/main/clip/bpe_simple_vocab_16e6.txt.gz
          echo '924691ac288e54409236115652ad4aa250f48203de50a9e4722a6ecd48d6804a  /tmp/bpe_simple_vocab_16e6.txt.gz' \
            | sha256sum -c -
      - run: ruff check services/perception
      - run: PYTHONPATH=services/perception/src python -m pytest services/perception/tests -q
        env:
          OEA_TEST_CLIP_VOCAB: /tmp/bpe_simple_vocab_16e6.txt.gz
      # The tests above run against src/, where every module is present whether
      # or not the packaging lists it — the same blind spot the `package` job
      # covers on the TypeScript side. Install it the way a user would, and ask
      # it what it can do.
      - name: Install the built package and ask it for a health report
        run: |
          python -m venv /tmp/worker
          /tmp/worker/bin/pip install ./services/perception
          echo '{"id":"1","op":"health","params":{}}' \
            | /tmp/worker/bin/editorial-perception \
            | tee /tmp/health.json
          python -c "import json,sys; r=json.load(open('/tmp/health.json')); sys.exit(0 if r.get('ok') else 'the worker did not answer health')"

  # Everything above runs against the worked example, whose `footage/` files are
  # ASCII placeholders that `scripts/make-example.mjs` writes. That is what makes
  # the compiler testable with no ffmpeg and no GPU, and it is also why nothing
  # here had ever run `probe`, `prepare`, `detect_shots` or `analyze_audio`
  # against a video — the entire media layer, which every later stage stands on.
  # The Python unit tests reach the pure functions either side of the subprocess
  # and never the subprocess itself.
  #
  # So this job synthesises a clip whose cuts are at known times and whose quiet
  # is in known places, and drives the real worker over the real JSON Lines
  # protocol against it. It needs no `pnpm install` and no build, which is why it
  # is the shortest job in this file despite being the only one that installs
  # ffmpeg.
  media:
    runs-on: ubuntu-latest
    # The worker's protocol loop blocks on stdin, so a reply that never comes is
    # a job that sits for six hours and then reports nothing. The script times
    # each request out at 60s; this is the backstop for ffmpeg itself hanging.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The runner image ships no ffmpeg, and this is the one job that is about
      # ffmpeg, so it installs rather than skipping. --no-install-recommends
      # keeps it to the codecs instead of pulling a desktop stack in behind them.
      - name: Install ffmpeg
        run: |
          command -v ffmpeg >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          }
          ffmpeg -version | head -1
          ffprobe -version | head -1
      # The script starts the worker from `services/perception/src` itself and
      # speaks the protocol directly, so a failure points at the media code
      # rather than at the TypeScript transport, which has its own tests. No
      # models are needed and nothing is downloaded.
      - name: Drive the real worker against real video
        run: node scripts/check-media.mjs

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The documented quick start, run as written. A quick start that has
      # quietly stopped working is the fastest way to lose someone on their
      # first attempt.
      - run: pnpm oea demo ./tmp/demo
      - run: pnpm oea timeline --project ./tmp/demo
      - run: pnpm oea plan --project ./tmp/demo --skill travel-vlog --duration 180 --quiet
      - run: pnpm oea apply --project ./tmp/demo --editor otio
      - run: pnpm oea apply --project ./tmp/demo --editor premiere
      - run: pnpm oea apply --project ./tmp/demo --editor aviutl2

      # The Python perception path, end to end, against a bare install with no
      # models. This is the shape of run that used to fail outright rather than
      # degrade, and the unit tests could not see it: they exercise the protocol,
      # not the CLI's wiring of it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Analyse through the Python worker with no models installed
        run: |
          python -m venv /tmp/worker
          /tmp/worker/bin/pip install ./services/perception
          pnpm oea demo ./tmp/py
          pnpm oea analyze --project ./tmp/py \
            --perception "python:/tmp/worker/bin/python" --force
          # A missing model costs you that stage, not the run.
          test -f ./tmp/py/.oea/ir.json

  # The repository is not what people install. Everything above this job runs
  # against the source tree, where every file exists and every workspace link
  # resolves — which is exactly why it cannot see a file missing from `files`, a
  # wrong `bin` path, or a runtime import of a devDependency. This job packs the
  # tarballs, installs them into an empty directory with npm, and runs the
  # documented walkthrough from the installed binary.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack every publishable package
        run: |
          mkdir -p /tmp/tarballs
          for dir in packages/* apps/cli; do
            [ -f "$dir/package.json" ] || continue
            (cd "$dir" && pnpm pack --pack-destination /tmp/tarballs)
          done
          ls -l /tmp/tarballs
      - name: Install them into an empty project
        run: |
          mkdir -p /tmp/install
          cd /tmp/install
          echo '{"name":"install-check","private":true,"version":"1.0.0"}' > package.json
          npm install --no-audit --no-fund /tmp/tarballs/*.tgz
      - name: Run the walkthrough from the installed binary
        working-directory: /tmp/install
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          oea --version
          # `demo` needs the worked example, which lives outside the package and
          # has to be copied in at pack time. This is the step that notices when
          # it was not.
          oea demo ./demo
          oea timeline --project ./demo
          oea plan --project ./demo --skill travel-vlog --duration 180 --quiet
          oea apply --project ./demo --editor otio
          # doctor reports a non-zero status when something needs attention, and
          # a runner without ffmpeg is exactly that. Run it for the output, not
          # for the status.
          oea doctor || true
          # A closed pipe must not look like a crash.
          oea skills | head -2
