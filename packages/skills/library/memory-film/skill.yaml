name: memory-film
version: 0.1.0
extends: [base-editor]
description: >-
  A film about people rather than events. Weighted almost entirely on feeling,
  cut gently, and given a long ending.
license: Apache-2.0

defaults:
  min_clip_duration_ms: 2000
  max_clip_duration_ms: 8000
  pad_in_ms: 200
  pad_out_ms: 500
  default_transition:
    type: hard_cut
    duration_ms: 0
  chapter_transition:
    type: cross_dissolve
    duration_ms: 800

scoring:
  weights:
    emotional_intensity: 1.0
    story_importance: 0.7
    uniqueness: 0.5
    information_density: 0.05
    visual_quality: 0.35
  flag_weights:
    preserve: 0.4
    redundant: -0.5

arc:
  ordering: chronological
  segments:
    - name: opening
      budget: 0.12
      prefer_roles: [setup, context]
    - name: middle
      budget: 0.58
      prefer_roles: [payoff, reaction, climax]
    - name: ending
      budget: 0.3
      prefer_roles: [resolution, ending]

intent:
  opening: gentle
  middle: warm
  ending: emotional

rules:
  - id: faces-over-places
    when:
      involves_person: [me, partner, family]
    action:
      prefer: 0.2

  - id: never-rush-a-feeling
    priority: 30
    when:
      emotional_intensity: '>0.6'
    action:
      minimum_duration_sec: 3.0
      avoid_aggressive_cutting: true
      preserve_reaction: true

  - id: laughter-is-the-point
    when:
      has_laughter: true
    action:
      prefer: 0.25
      minimum_duration_sec: 2.5

  - id: information-is-not-the-point
    when:
      narrative_role: context
      emotional_intensity: '<0.3'
    action:
      avoid: 0.2
      maximum_duration_sec: 3.0
