name: travel-vlog
version: 0.1.0
extends: [base-editor]
description: >-
  A day somewhere, in order. Show where you are before what happens there, let
  the good moments breathe, and end somewhere that feels like an ending.
license: Apache-2.0

defaults:
  min_clip_duration_ms: 1500
  max_clip_duration_ms: 9000
  chapter_transition:
    type: cross_dissolve
    duration_ms: 400

scoring:
  weights:
    emotional_intensity: 0.7
    uniqueness: 0.5
    information_density: 0.2
  flag_weights:
    establishing_shot: 0.3

arc:
  ordering: chronological
  segments:
    - name: opening
      budget: 0.15
      prefer_roles: [setup, context]
    - name: middle
      budget: 0.6
      prefer_roles: [payoff, reaction, climax, transition]
    - name: ending
      budget: 0.25
      prefer_roles: [resolution, ending]

intent:
  opening: energetic
  middle: fun
  ending: emotional

rules:
  - id: establish-a-new-place
    description: A viewer who does not know where they are cannot follow what happens there.
    when:
      establishing_shot_probability: ">0.7"
      new_location: true
    action:
      prefer: 0.3
      minimum_duration_sec: 2.0

  - id: let-feeling-breathe
    description: The reaction after the moment is usually the moment.
    when:
      emotional_intensity: ">0.8"
    action:
      minimum_duration_sec: 3.0
      preserve_reaction: true

  - id: do-not-cut-into-a-payoff
    when:
      narrative_role: payoff
    action:
      avoid_aggressive_cutting: true
      prefer: 0.15

  - id: keep-travel-short
    description: Getting there is context, not the trip.
    when:
      narrative_role: transition
    action:
      maximum_duration_sec: 3.0
      avoid: 0.1

  - id: one-meal-is-enough
    when:
      event_type: meal
      redundancy: ">0.6"
    action:
      prefer_higher_quality_only: true
