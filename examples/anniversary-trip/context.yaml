# What you know that the footage cannot contain.
#
# This file outranks everything the models decide. Nothing here is ever
# overwritten by analysis, and an occasion written here changes which moments the
# edit considers important.

project_id: prj_example
updated_at: 2026-05-17T09:00:00.000Z

background:
  occasion: 交際1周年旅行
  summary: 大阪への一泊旅行。USJで一日遊んで、最後は夜景を見に行った。
  people:
    # An alias does not have to be a name. The camera label two_people means both
    # of us are in shot, and saying so here is what lets a skill ask for the
    # moments we are both in — without it, the people section does nothing on
    # footage where nobody says a name out loud, which is most footage.
    - id: me
      role: 自分
      aliases: [two_people]
    - id: partner
      role: 彼女
      aliases: [two_people]
  places:
    - id: USJ
      display_name: ユニバーサル・スタジオ・ジャパン
      aliases: [ユニバ, universal studios japan]
    - id: 展望台
      display_name: 梅田スカイビル空中庭園
      # Aliases are how a name you use reaches footage that never says it: the
      # transcript here says きれいだね, not 展望台, and the label on the picture is
      # in English.
      aliases: [observation_deck, 空中庭園]
  vocabulary: [ユニバ, 梅田スカイビル, たこ焼き]
  notes: []

editing_goal:
  target_duration_ms: 180000
  tolerance_ms: 15000
  tone: [fun, warm]
  opening: [energetic]
  ending: [emotional]
  language: ja
  instruction: >-
    3分くらいで、前半はテンポ良く、最後の夜景からは少し感動的にして。
    食事は全部見せる必要はない。

constraints:
  forbidden: []
  required_assets: []
  excluded_assets: []
  allow_speed_change: false
  allowed_music: []
  forbidden_music: []
